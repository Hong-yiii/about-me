<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630" role="img" aria-labelledby="title desc">
  <title id="title">One laptop, a lot of agents</title>
  <desc id="desc">An editorial illustration of a laptop connected to GPU compute and separate project VMs. These are conceptual environments, not a live machine inventory.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10272c"/><stop offset="1" stop-color="#101921"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b5e7d6" stroke-opacity=".045"/></pattern>
  </defs>
